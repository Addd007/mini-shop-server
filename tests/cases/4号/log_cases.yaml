# ======================== 异常日志 ========================

- id: TC-LOG-009
  summary: 查询异常日志列表
  tag: error_log
  priority: P1
  method: GET
  path: /cms/log/error/list
  expected:
    status_code: 200
    json:
      error_code: 0

# ======================== 日志记录验证 ========================

- id: TC-LOG-010
  summary: 登录后产生登录日志记录
  tag: log_audit
  priority: P0
  method: POST
  path: /v1/token
  json:
    account: super
    secret: "123456"
    type: 100
  expected:
    status_code: 200
    has_token: true
  check_login_log: true

- id: TC-LOG-011
  summary: 密码错误不产生成功登录日志
  tag: log_audit
  priority: P0
  method: POST
  path: /v1/token
  json:
    account: super
    secret: wrongpassword
    type: 100
  expected:
    has_token: false
    error: true
  check_login_log_fail: true
