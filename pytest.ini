[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -ra
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    smoke: 冒烟测试
    regression: 回归测试
    auth: 登录鉴权相关测试
    order: 订单支付相关测试
    file: 文件上传下载相关测试
    rbac: 权限与菜单相关测试
    login_log: 登录日志相关测试
    user: 用户相关测试
    product: 商品相关测试
    delete_account: 注销账号相关测试
    register_reuse: 删除后复用注册相关测试
    auth_perm: 权限分配管理相关测试
    group: 权限组管理相关测试
    menu: 菜单管理相关测试
    route: 路由管理相关测试
    config: 参数配置相关测试
    dict: 字典管理相关测试
    notice: 通知管理相关测试
    oper_log: 操作日志相关测试
