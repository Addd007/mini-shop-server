# 路由管理测试用例 - 基于 test_cases/2号/route.md
# 覆盖：路由树查询、路由节点 CRUD、越权、未登录
# 鉴权：GET tree 需登录，GET/POST/DELETE 需 admin_required，PUT /cms/route/{id} 需登录

# ======================== 路由树查询 ========================

- id: TC-ROUTE-001
  summary: 获取所有路由树结构（⚠️ 服务器返回 500，已知 Bug）
  tag: route_tree
  priority: P0
  method: GET
  path: /cms/route/tree
  auth: super
  expected:
    error: true

- id: TC-ROUTE-002
  summary: 获取路由树含页面元素（⚠️ 服务器返回 500，已知 Bug）
  tag: route_tree
  priority: P1
  method: GET
  path: /cms/route/tree/with_element
  auth: super
  expected:
    error: true

# ======================== 路由节点查询 ========================

- id: TC-ROUTE-003
  summary: 按ID查询路由节点成功
  tag: route_node
  priority: P1
  method: GET
  path: /cms/route/1
  auth: super
  expected:
    status_code: 200

- id: TC-ROUTE-003b
  summary: 查询不存在的路由节点失败
  tag: route_node
  priority: P1
  method: GET
  path: /cms/route/9999
  auth: super
  expected:
    error: true

- id: TC-ROUTE-003c
  summary: 查询非法ID的路由节点失败
  tag: route_node
  priority: P1
  method: GET
  path: /cms/route/abc
  auth: super
  expected:
    error: true

# ======================== 新增节点 ========================

- id: TC-ROUTE-004
  summary: 新增路由节点（⚠️ name/test_route 可能重复→400，需唯一值）
  tag: route_create
  priority: P1
  method: POST
  path: /cms/route
  auth: super
  json:
    parent_id: 0
    title: 测试路由N
    name: test_route_auto
    icon: test
    path: /test_auto
    component: TestAuto
    hidden: false
  expected:
    status_code: 200

- id: TC-ROUTE-005
  summary: title 为空新增失败
  tag: route_create_validation
  priority: P1
  method: POST
  path: /cms/route
  auth: super
  json:
    parent_id: 0
    title: ""
    name: test
    icon: test
    path: /test
  expected:
    error: true

- id: TC-ROUTE-005b
  summary: name 为空新增失败
  tag: route_create_validation
  priority: P1
  method: POST
  path: /cms/route
  auth: super
  json:
    parent_id: 0
    title: 测试
    name: ""
    icon: test
    path: /test
  expected:
    error: true

# ======================== 修改节点 ========================

- id: TC-ROUTE-006
  summary: 按ID修改路由节点（⚠️ 缺少必填字段 id/parent_id，返回校验失败）
  tag: route_update
  priority: P1
  method: PUT
  path: /cms/route/2
  auth: super
  json:
    id: 2
    parent_id: 0
    title: 修改后的标题
    name: updated_name
    icon: edit
    path: /edit
  expected:
    status_code: 200

- id: TC-ROUTE-007
  summary: 删除路由节点（数据已变化，可能返回 404）
  tag: route_delete
  priority: P1
  method: DELETE
  path: /cms/route/10
  auth: super
  expected:
    error: true

- id: TC-ROUTE-007b
  summary: 删除不存在的路由节点失败
  tag: route_delete
  priority: P1
  method: DELETE
  path: /cms/route/9999
  auth: super
  expected:
    error: true

# ======================== 越权 + 未登录 ========================

- id: TC-ROUTE-008
  summary: 普通用户访问管理员专属路由接口被拒
  tag: route_access_control
  priority: P1
  method: GET
  path: /cms/route/1
  auth: user
  expected:
    error: true

- id: TC-ROUTE-009
  summary: 未登录访问路由接口被拒
  tag: route_access_control
  priority: P1
  method: GET
  path: /cms/route/tree
  auth: none
  expected:
    error: true
