[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -ra
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    smoke: Smoke tests
    regression: Regression tests
    auth: Authentication tests
    order: Order and payment tests
    order_business: Order business rule tests
    catalog_business: Catalog and category tests
    order_state: Order state transition tests
    idempotency: Idempotency tests
    file: File upload and download tests
    rbac: Permission and menu tests
    login_log: Login log tests
    user: User tests
    product: Product tests
    delete_account: Account deletion tests
    register_reuse: Re-registration after deletion tests
    auth_perm: Auth permission management tests
    group: Group management tests
    menu: Menu management tests
    route: Route management tests
    config: Config management tests
    dict: Dict management tests
    notice: Notice management tests
    oper_log: Operation log tests
    recovery: Recovery tests (kill/restart, DB reconnect, transaction rollback)
    deployment: Deployment tests (env switch, API docs)
    stability: Stability and compatibility tests (continuous requests, multi-role access)
    slow: Long-running tests (30-min continuous requests)
    perf: Performance tests (concurrent stress)
    security: Security tests (injection, tampering, privilege escalation)
