# 登录与鉴权测试用例 - 基于 test_cases/1号/auth.md
# 覆盖：用户名登录、邮箱登录、手机号登录、异常登录、参数校验、Token 校验

# ======================== 登录成功 ========================

- id: TC-AUTH-001
  summary: 超级管理员用户名登录成功
  tag: login_success
  priority: P0
  method: POST
  path: /v1/token
  json:
    account: super
    secret: "123456"
    type: 100
  expected:
    status_code: 200
    has_token: true

