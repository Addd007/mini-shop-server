# ======================== 删除操作日志（admin_required） ========================

- id: TC-OPER-014
  summary: 删除单条操作日志成功
  tag: oper_delete
  priority: P2
  method: DELETE
  path: /cms/log/oper/9
  auth: super
  expected:
    status_code: 202

- id: TC-OPER-015
  summary: 删除不存在的操作日志失败
  tag: oper_delete
  priority: P1
  method: DELETE
  path: /cms/log/oper/9999
  auth: super
  expected:
    error: true

- id: TC-OPER-016
  summary: 删除非法ID的操作日志失败
  tag: oper_delete_validation
  priority: P1
  method: DELETE
  path: /cms/log/oper/abc
  auth: super
  expected:
    error: true

- id: TC-OPER-017
  summary: 未登录删除操作日志
  tag: oper_access_control
  priority: P1
  method: DELETE
  path: /cms/log/oper/1
  auth: none
  expected:
    error: true

- id: TC-OPER-018
  summary: 普通用户无权限删除操作日志
  tag: oper_access_control
  priority: P1
  method: DELETE
  path: /cms/log/oper/1
  auth: user
  expected:
    error: true

