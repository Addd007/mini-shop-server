# ======================== Token 校验 ========================

- id: TC-AUTH-021
  summary: 未携带 Token 访问校验接口
  tag: token_verify
  priority: P0
  method: POST
  path: /v1/token/verify
  json:
    token: ""
  expected:
    error: true

- id: TC-AUTH-022
  summary: 伪造 Token 访问校验接口
  tag: token_verify
  priority: P0
  method: POST
  path: /v1/token/verify
  json:
    token: fake-token
  expected:
    error: true

- id: TC-AUTH-023
  summary: 有效 Token 访问校验接口
  tag: token_verify
  priority: P0
  method: POST
  path: /v1/token/verify
  json:
    token: "{valid_token}"
  expected:
    status_code: 200
    json:
      error_code: 0
