# 订单接口测试用例 - 基于 test_cases/1号/order.md
# 覆盖：订单提交、订单列表、订单详情

# ======================== 订单提交 ========================

- id: TC-ORDER-001
  summary: 用户提交订单成功
  tag: order_place
  priority: P0
  skip: false
  skip_reason: 该接口幂等性未完善
  method: POST
  path: /v1/order
  auth: user
  json:
    products:
      - product_id: 2
        count: 10
  expected:
    status_code: 201

- id: TC-ORDER-002
  summary: 商品列表参数校验失败
  tag: order_place
  priority: P0
  method: POST
  path: /v1/order
  auth: user
  json:
    products: []
  expected:
    status_code: 400

- id: TC-ORDER-003
  summary: 商品数量参数非法
  tag: order_place
  priority: P0
  method: POST
  path: /v1/order
  auth: user
  json:
    products:
      - product_id: 1
        count: 0
  expected:
    status_code: 400

- id: TC-ORDER-004
  summary: 未登录提交订单失败
  tag: order_place
  priority: P0
  method: POST
  path: /v1/order
  auth: none
  json:
    products:
      - product_id: 1
        count: 1
  expected:
    status_code: 401

