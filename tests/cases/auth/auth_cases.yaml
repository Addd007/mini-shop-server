- id: TC-AUTH-001
  title: 有效账号登录成功
  method: POST
  url: /v1/token
  request:
    username: admin
    password: "123456"
  extract:
    token: $.token
  assert:
    status_code: 200
    json_contains:
      code: 0
- id: TC-AUTH-002
  title: 错误密码登录失败
  method: POST
  url: /v1/token
  request:
    username: admin
    password: wrong-password
  assert:
    status_code: 400