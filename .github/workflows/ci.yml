name: CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - "app/**"
      - "tests/**"
      - "fake.py"
      - "server.py"
      - "pyproject.toml"
      - "pytest.ini"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "fake.py"
      - "server.py"
      - "pyproject.toml"
      - "pytest.ini"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8"]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ZBH924zxcvbnm
          MYSQL_DATABASE: zerd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pZBH924zxcvbnm"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if uv run python -c "import pymysql; conn = pymysql.connect(host='127.0.0.1', user='root', password='ZBH924zxcvbnm', database='zerd', port=3306); conn.close()"; then
              echo "MySQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL was not ready in time" >&2
          exit 1

      - name: Run tests with Allure results
        run: uv run pytest --alluredir=allure-results

      - name: Set up Node.js
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: Generate Allure HTML report
        if: always()
        run: allure generate allure-results -o allure-report --clean

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
