[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -ra
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    smoke: 冒烟测试
    regression: 回归测试
    integration: 集成测试
    auth: 登录鉴权相关测试
    order: 订单支付相关测试
    order_business: 订单业务规则相关测试
    catalog_business: 商品分类与主题轮播相关测试
    order_state: 订单状态流转相关测试
    idempotency: 幂等性相关测试
    file: 文件上传下载相关测试
    rbac: 权限与菜单相关测试
    login_log: 登录日志相关测试
    user: 用户相关测试
    product: 商品相关测试
    delete_account: 注销账号相关测试
    register_reuse: 删除后复用注册相关测试
    auth_perm: 权限分配管理相关测试
    group: 权限组管理相关测试
    menu: 菜单管理相关测试
    route: 路由管理相关测试
    config: 参数配置相关测试
    dict: 字典管理相关测试
    notice: 通知管理相关测试
    oper_log: 操作日志相关测试
    recovery: 恢复相关测试（杀进程/重启、数据库重连、事务回滚）
    deployment: 部署相关测试（环境切换、接口文档）
    stability: 稳定性与兼容性测试（持续请求、多角色访问）
    slow: 长耗时测试（30 分钟持续请求）
    perf: 性能测试（并发压测）
    security: 安全测试（注入、篡改、越权）
