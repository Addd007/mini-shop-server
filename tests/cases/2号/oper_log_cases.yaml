# 操作日志测试用例 - 基于 test_cases/2号/oper_log.md
# 覆盖：操作日志搜索、用户列表、删除、清空
# 鉴权：搜索/用户列表需 @auth.group_required，删除/清空需 @auth.admin_required
# ⚠️ 注意：GET /cms/log/oper/{id} 接口不存在（仅支持 DELETE），已跳过

# ======================== 操作日志搜索 ========================

- id: TC-OPER-001
  summary: 按人员/时间/内容搜索操作日志
  tag: oper_search
  priority: P1
  method: GET
  path: /cms/log/oper/list/search
  auth: super
  params:
    page: 1
    size: 10
    username: super
    keyword: 操作
  expected:
    status_code: 200

- id: TC-OPER-002
  summary: 仅按用户名搜索操作日志
  tag: oper_search
  priority: P1
  method: GET
  path: /cms/log/oper/list/search
  auth: super
  params:
    page: 1
    size: 10
    username: super
  expected:
    status_code: 200

- id: TC-OPER-003
  summary: 仅按关键字搜索操作日志
  tag: oper_search
  priority: P1
  method: GET
  path: /cms/log/oper/list/search
  auth: super
  params:
    page: 1
    size: 10
    keyword: 成功
  expected:
    status_code: 200

- id: TC-OPER-004
  summary: 时间范围无数据时返回空列表
  tag: oper_search
  priority: P2
  method: GET
  path: /cms/log/oper/list/search
  auth: super
  params:
    page: 1
    size: 10
    start: 1000000000
    end: 1000001000
  expected:
    status_code: 200

- id: TC-OPER-005
  summary: 分页参数边界（page=0 size=0）
  tag: oper_search_validation
  priority: P1
  method: GET
  path: /cms/log/oper/list/search
  auth: super
  params:
    page: 0
    size: 0
  expected:
    error: true

- id: TC-OPER-006
  summary: 页码超范围时返回 404（⚠️ 预期返回空列表）
  tag: oper_search
  priority: P2
  method: GET
  path: /cms/log/oper/list/search
  auth: super
  params:
    page: 9999
    size: 10
  expected:
    error: true

- id: TC-OPER-007
  summary: 未登录访问操作日志搜索
  tag: oper_access_control
  priority: P1
  method: GET
  path: /cms/log/oper/list/search
  auth: none
  params:
    page: 1
    size: 10
  expected:
    error: true

- id: TC-OPER-008
  summary: 普通用户无权限访问操作日志搜索
  tag: oper_access_control
  priority: P1
  method: GET
  path: /cms/log/oper/list/search
  auth: user
  params:
    page: 1
    size: 10
  expected:
    error: true

- id: TC-OPER-009
  summary: 非法时间格式应返回校验失败（⚠️ 疑似 Bug）
  tag: oper_search
  priority: P1
  method: GET
  path: /cms/log/oper/list/search
  auth: super
  params:
    page: 1
    size: 10
    start: "2026-13-40"
    end: abc
  expected:
    error: true
  skip: true
  skip_reason: "已知Bug BUG-OPER-SEARCH-001: 非法时间格式未校验，仍返回成功"

