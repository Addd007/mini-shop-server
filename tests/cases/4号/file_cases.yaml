# ======================== 上传失败/参数校验 ========================

- id: TC-FILE-007
  summary: 上传不支持的文件类型（.exe）
  tag: upload_failure
  priority: P0
  method: POST
  path: /cms/file/0
  is_upload: true
  file_field: file
  use_forbidden_file: true
  expected:
    error: true

- id: TC-FILE-008
  summary: 上传不支持的文件类型（.sh）
  tag: upload_failure
  priority: P1
  method: POST
  path: /cms/file/0
  is_upload: true
  file_field: file
  use_forbidden_file: true
  file_suffix: .sh
  expected:
    error: true

- id: TC-FILE-009
  summary: 无文件上传
  tag: upload_failure
  priority: P1
  method: POST
  path: /cms/file/0
  is_upload: true
  file_field: file
  upload_empty: true
  expected:
    error: true

- id: TC-FILE-010
  summary: 无 Token 上传文件
  tag: upload_failure
  priority: P0
  method: POST
  path: /cms/file/0
  is_upload: true
  file_field: file
  no_auth: true
  expected:
    error: true

# ======================== 文件管理 ========================

- id: TC-FILE-011
  summary: 查询支持的文件类型列表
  tag: file_manage
  priority: P1
  method: GET
  path: /cms/file/types
  expected:
    status_code: 200
    json:
      error_code: 0

- id: TC-FILE-012
  summary: 查询文件列表（根目录）
  tag: file_manage
  priority: P0
  method: GET
  path: /cms/file/list
  params:
    parent_id: 0
  expected:
    status_code: 200
    json:
      error_code: 0

- id: TC-FILE-013
  summary: 新建文件夹
  tag: file_manage
  priority: P0
  method: POST
  path: /cms/file/new
  params:
    parent_id: 0
    filename: "{unique_folder_name}"
  expected:
    status_code: 200
    json:
      error_code: 0

- id: TC-FILE-014
  summary: 获取目录树
  tag: file_manage
  priority: P1
  method: GET
  path: /cms/file/folder
  expected:
    status_code: 200
    json:
      error_code: 0

# ======================== 文件详情/查询 ========================

- id: TC-FILE-015
  summary: 根据文件名查询文件
  tag: file_query
  priority: P1
  method: GET
  path: /cms/file/name/{filename}
  expected:
    status_code: 200

- id: TC-FILE-016
  summary: 查询不存在的文件详情
  tag: file_query
  priority: P2
  method: GET
  path: /cms/file/99999
  expected:
    status_code: 404

# ======================== 重命名/移动/复制 ========================

- id: TC-FILE-017
  summary: 重命名文件
  tag: file_manage
  priority: P1
  method: PUT
  path: /cms/file/rename
  params:
    file_id: "{uploaded_file_id}"
    filename: renamed_by_test
  expected:
    status_code: 201

- id: TC-FILE-018
  summary: 重命名不存在的文件
  tag: file_manage
  priority: P2
  method: PUT
  path: /cms/file/rename
  params:
    file_id: 99999
    filename: renamed
  expected:
    status_code: 404

# ======================== 删除文件 ========================

- id: TC-FILE-019
  summary: 批量删除文件
  tag: file_delete
  priority: P0
  method: DELETE
  path: /cms/file
  params:
    ids: "{uploaded_file_ids}"
  expected:
    status_code: 202

- id: TC-FILE-020
  summary: 删除不存在的文件
  tag: file_delete
  priority: P2
  method: DELETE
  path: /cms/file
  params:
    ids: "99999,99998"
  expected:
    status_code: 202

# ======================== 静态资源访问 ========================

- id: TC-FILE-021
  summary: 访问静态图片资源
  tag: static_resource
  priority: P1
  method: GET
  path: /static/images/placeholder.png
  is_static: true
  expected:
    status_code: 200

- id: TC-FILE-022
  summary: 访问不存在的静态资源
  tag: static_resource
  priority: P2
  method: GET
  path: /static/images/not_exist_xyz.png
  is_static: true
  expected:
    status_code: 404

# ======================== 下载完整性验证 ========================

- id: TC-FILE-023
  summary: 上传后下载文件并验证完整性（MD5 比对）
  tag: download_verify
  priority: P0
  method: POST
  path: /cms/file/0
  is_upload: true
  file_field: file
  verify_download: true
  expected:
    status_code: 200

- id: TC-FILE-024
  summary: 下载已上传文件的静态资源 URL
  tag: download_verify
  priority: P1
  method: POST
  path: /cms/file/0
  is_upload: true
  file_field: file
  verify_static_url: true
  expected:
    status_code: 200

# ======================== 上传去重/边界 ========================

- id: TC-FILE-025
  summary: 重复上传相同文件（MD5去重验证）
  tag: upload_dedup
  priority: P1
  method: POST
  path: /cms/file/0
  is_upload: true
  file_field: file
  upload_twice: true
  expected:
    status_code: 200

- id: TC-FILE-026
  summary: 超大文件上传被拒绝（>100MB单文件限制）
  tag: upload_boundary
  priority: P1
  method: POST
  path: /cms/file/0
  is_upload: true
  file_field: file
  use_oversized: true
  expected:
    error: true

# ======================== 文件夹上传/移动/复制 ========================

- id: TC-FILE-027
  summary: 上传到新建文件夹内
  tag: upload_folder
  priority: P1
  method: POST
  path: /cms/file/{folder_id}
  is_upload: true
  file_field: file
  expected:
    status_code: 200

- id: TC-FILE-028
  summary: 移动文件到根目录
  tag: file_move
  priority: P1
  method: PUT
  path: /cms/file/move
  params:
    parent_id: 0
    ids: "{uploaded_file_ids}"
  expected:
    status_code: 200

- id: TC-FILE-029
  summary: 复制文件
  tag: file_copy
  priority: P2
  method: POST
  path: /cms/file/copy
  params:
    parent_id: 0
