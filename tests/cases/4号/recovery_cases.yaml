# 异常恢复测试 — 4号专项

# ======================== 健康检查 ========================

- id: TC-RECOV-001
  summary: 健康检查端点可用
  tag: recovery
  priority: P0
  method: GET
  path: /health
  no_auth: true
  expected:
    status_code: 200

# ======================== 错误处理 ========================

- id: TC-RECOV-002
  summary: 请求不存在路由返回 404
  tag: recovery
  priority: P1
  method: GET
  path: /api/nonexistent_endpoint_xyz
  no_auth: true
  expected:
    status_code: 404

- id: TC-RECOV-003
  summary: 无效 JSON 格式请求被正确处理
  tag: recovery
  priority: P1
  method: POST
  path: /v1/token
  send_raw: "{invalid json!!!}"
  expected:
    status_code: 400

- id: TC-RECOV-004
  summary: 超大请求体处理不崩溃
  tag: recovery
  priority: P2
  method: POST
  path: /v1/token
  json:
    account: super
    secret: "123456"
    type: 100
    junk_field: "{large_payload}"
  expected:
    status_code: 200

# ======================== 稳定性 ========================

- id: TC-RECOV-005
  summary: 连续请求后服务仍稳定
  tag: recovery
  priority: P2
  method: GET
  path: /cms/file/types
  repeat_count: 50
  expected:
    status_code: 200
    all_success: true

# ======================== 安全防护 ========================

- id: TC-RECOV-006
  summary: 特殊字符参数处理（SQL注入尝试）
  tag: recovery
  priority: P1
  method: GET
  path: /cms/file/name/'; DROP TABLE file; --
  expected:
    status_code: 200

# ======================== 边界条件 ========================

- id: TC-RECOV-007
  summary: 超长参数处理不崩溃
  tag: recovery
  priority: P2
  method: GET
  path: /cms/file/name/{long_string}
  expected:
    status_code: 200
