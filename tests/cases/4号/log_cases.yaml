# 日志审计测试用例 — 4号专项
# 基于 app/api/cms/login_log.py, oper_log.py, error_log.py

# ======================== 登录日志 ========================

- id: TC-LOG-001
  summary: 查询登录日志列表
  tag: login_log
  priority: P0
  method: GET
  path: /cms/log/login/list
  expected:
    status_code: 200
    json:
      error_code: 0

- id: TC-LOG-002
  summary: 查询登录日志列表（带时间筛选）
  tag: login_log
  priority: P1
  method: GET
  path: /cms/log/login/list
  params:
    start: "{yesterday}"
    end: "{today}"
  expected:
    status_code: 200
    json:
      error_code: 0

- id: TC-LOG-003
  summary: 无 Token 访问登录日志
  tag: login_log
  priority: P0
  method: GET
  path: /cms/log/login/list
  no_auth: true
  expected:
    error: true

